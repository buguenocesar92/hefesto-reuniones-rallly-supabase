services:
  preflight:
    environment:
      BOOTSTRAP_MODE: 'true'
  app:
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:8115
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PWD: ''
      SMTP_SECURE: 'false'
      NOREPLY_EMAIL: reuniones@example.invalid
      BOOTSTRAP_MODE: 'true'
      REGISTRATION_ENABLED: 'true'
      ALLOWED_EMAILS: ${INITIAL_ADMIN_EMAIL}
    ports:
    - 127.0.0.1:8115:3000
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
    - 127.0.0.1:8031:8025
    restart: unless-stopped
